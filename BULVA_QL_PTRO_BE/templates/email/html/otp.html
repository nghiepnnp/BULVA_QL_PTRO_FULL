<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác thực OTP</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f6f7;
      font-family: Roboto, Helvetica, sans-serif;
      color: #222;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f5f6f7; padding: 30px 15px;"
    >
      <tr>
        <td align="center">

          <!-- Logo -->
          <!-- <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
          >
            <tr>
              <td
                align="center"
                style="padding-bottom: 25px;"
              >
                <img
                  src="{{logoUrl}}"
                  alt="{{appName}}"
                  style="
                    max-height: 55px;
                    max-width: 180px;
                    display: block;
                  "
                />
              </td>
            </tr>
          </table> -->

          <!-- Content -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              background-color: #ffffff;
              padding: 45px 55px;
            "
          >
            <tr>
              <td
                style="
                  font-size: 15px;
                  line-height: 1.7;
                "
              >
                <p style="margin: 0 0 17px;">
                  Xin chào <strong>{{name}}</strong>,
                </p>
<!-- 
                <p style="margin: 0 0 14px;">
                  Bạn đang thực hiện xác thực tài khoản
                  <strong>{{appName}}</strong>.
                </p> -->

                <p style="margin: 0 auto; width: 100%; text-align: center; font-size: 17px;">
                  Mã xác thực của bạn 👇
                </p>

                <!-- OTP -->
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        background-color: #f6f7f8;
                        border: 1px dashed #d6d9dc;
                        border-radius: 8px;
                        padding: 22px;
                      "
                    >
                      <div
                        style="
                          font-size: 40px;
                          font-weight: 700;
                          letter-spacing: 8px;
                          color: #087af5;
                        "
                      >
                        {{code}}
                      </div>

                      <div
                        style="
                          margin-top: 10px;
                          font-size: 13px;
                          color: #777;
                        "
                      >
                        Mã có hiệu lực trong <strong style="color: #ff0000; font-weight: 400;">{{expiresIn}} phút.</strong>
                      </div>
                    </td>
                  </tr>
                </table>

              </td>
            </tr>
          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
