<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kích hoạt tài khoản</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f6f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f5f6f7; padding: 30px 15px;"
    >
      <tr>
        <td align="center">

          <!-- <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
          >
            <tr>
              <td align="center" style="padding-bottom: 25px;">
                <img
                  src="{{logoUrl}}"
                  alt="{{appName}}"
                  style="
                    max-height: 55px;
                    max-width: 180px;
                    display: block;
                  "
                />
              </td>
            </tr>
          </table> -->

          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              background-color: #ffffff;
              padding: 45px 55px;
            "
          >
            <tr>
              <td
                style="
                  font-size: 15px;
                  line-height: 1.7;
                "
              >
                <p style="margin: 0 0 14px;">
                  Chào bạn <strong>{{name}}</strong>,
                </p>

                <p style="margin: 0 0 14px;">
                  Cảm ơn bạn đã đăng ký tài khoản tại
                  <strong>{{appName}}</strong>.
                </p>

                <p style="margin: 0 0 24px;">
                  Vui lòng nhấn vào nút bên dưới để kích hoạt tài khoản:
                </p>

                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td align="center">
                      <a
                        href="{{activationUrl}}"
                        style="
                          display: inline-block;
                          background-color: #1677ff;
                          color: #ffffff;
                          text-decoration: none;
                          font-size: 15px;
                          font-weight: 600;
                          padding: 13px 28px;
                          border-radius: 6px;
                        "
                      >
                        Kích hoạt tài khoản
                      </a>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 13px;
                    color: #777;
                  "
                >
                  Liên kết kích hoạt có hiệu lực trong {{expiresIn}} phút.
                </p>

                <p
                  style="
                    margin: 10px 0 0;
                    font-size: 13px;
                    color: #777;
                  "
                >
                  Nếu bạn không thực hiện đăng ký này, bạn có thể bỏ qua email.
                </p>

              </td>
            </tr>
          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
